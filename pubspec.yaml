name: playing_tracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  # --- Core de Flutter e Internacionalización ---
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Firebase (Backend y Servicios) ---
  firebase_core: ^4.2.1           # Núcleo de Firebase
  cloud_firestore: ^6.1.0         # Base de datos NoSQL Cloud Firestore
  firebase_auth: ^6.1.2           # Autenticación de usuarios
  firebase_app_check: ^0.4.1+4    # Protección contra abusos y seguridad
  google_sign_in: ^7.2.0          # Autenticación con Google
  sign_in_with_apple: ^7.0.1      # Autenticación con Apple (iOS)

  # --- Gestión de Estado (BLoC / Cubit) ---
  flutter_bloc: ^9.1.1            # Framework de gestión de estado basado en eventos
  equatable: ^2.0.7               # Simplifica la comparación de objetos
  hydrated_bloc: ^10.1.1          # Persistencia automática del estado de los Blocs

  # --- Navegación ---
  go_router: ^17.0.0              # Enrutador declarativo moderno para Flutter

  # --- UI, Diseño y Gráficos ---
  google_fonts: ^8.0.0            # Acceso a cientos de fuentes de Google Fonts
  fl_chart: ^1.1.1                # Librería de gráficos para estadísticas y métricas
  flutter_markdown_plus: ^1.0.7   # Renderizado de documentos Markdown (Términos legales)

  # --- Tutorial y Onboarding ---
  tutorial_coach_mark: ^1.3.3     # Tutorial interactivo con highlights sobre elementos UI

  # --- Persistencia y Utilidades del Sistema ---
  shared_preferences: ^2.5.4      # Almacenamiento local de preferencias clave-valor
  path_provider: ^2.1.5           # Acceso a directorios del sistema de archivos
  wakelock_plus: ^1.4.0           # Evita que la pantalla se apague automáticamente

  # --- Datos e Internacionalización ---
  intl: ^0.20.2                   # Utilidades de fecha, número e i18n
  uuid: ^4.5.1                    # Generación de códigos de acceso e IDs únicos
  json_annotation: ^4.9.0         # Anotaciones para serialización JSON

dev_dependencies:
  # --- Flutter SDK Testing ---
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # --- Análisis y Calidad ---
  flutter_lints: ^6.0.0            # Reglas de estilo recomendadas por Dart/Flutter

  # --- Generación de Código ---
  build_runner: ^2.10.4           # Herramienta base para generadores de código
  json_serializable: ^6.11.2       # Generador automático de lógica JSON
  go_router_builder: ^4.1.3       # Generador de rutas con tipado fuerte

  # --- Assets e Iconos ---
  flutter_launcher_icons: ^0.14.3  # Generador de iconos nativos (Android/iOS)
  flutter_native_splash: ^2.4.3    # Generador de pantallas de carga nativas

  # --- Suite de Testing ---
  bloc_test: ^10.0.0               # Testing especializado para BLoC/Cubit
  mocktail: ^1.0.4                 # Librería para creación de Mocks
  fake_cloud_firestore: ^4.0.0     # Firestore simulado para pruebas unitarias

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/legal/
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  image_dark: assets/images/logo.png
  color_dark: "#121212"
  android: true
  ios: true
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/images/logo.png
    icon_background_color_dark: "#121212"
