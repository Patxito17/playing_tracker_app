name: Production Build

on:
  push:
    tags:
      - 'v*.*.*'  # Se activa en tags como v1.0.0, v1.2.3, etc.
  workflow_dispatch:    # Permite lanzar el workflow manualmente desde GitHub Actions UI

env:
  FLUTTER_VERSION: '3.41.3'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Validación de calidad (debe pasar antes de compilar)
  # ──────────────────────────────────────────────────────────────────────────
  quality_check:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Inject firebase_options.dart
        run: |
          if [ -n "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/firebase_options.dart
          else
            echo "Warning: FIREBASE_OPTIONS_BASE64 secret is missing. The build might fail."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  # ──────────────────────────────────────────────────────────────────────────
  # Build Android (App Bundle para Google Play)
  # ──────────────────────────────────────────────────────────────────────────
  build_android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    needs: quality_check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Inject firebase_options.dart
        run: |
          if [ -n "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/firebase_options.dart
          else
            echo "Warning: FIREBASE_OPTIONS_BASE64 secret is missing. The build might fail."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode Android keystore and Google Services configuration
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          else
            echo "Warning: GOOGLE_SERVICES_JSON_BASE64 secret is missing. Android build might fail."
          fi

      - name: Build App Bundle (obfuscated)
        env:
          ANDROID_KEYSTORE_PATH: android/app/release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols/android \
            --build-number="${{ github.run_number }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-symbols-${{ github.ref_name }}
          path: build/symbols/android/

      # ── Subida de símbolos a Firebase Crashlytics ─────────────────────────
      # Requiere: GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 (secret) y FIREBASE_APP_ID_ANDROID (var)
      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload Crashlytics symbols (Android)
        if: vars.FIREBASE_APP_ID_ANDROID != ''
        env:
          FIREBASE_APP_ID_ANDROID: ${{ vars.FIREBASE_APP_ID_ANDROID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > /tmp/sa_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa_key.json
          firebase crashlytics:symbols:upload \
            --app="$FIREBASE_APP_ID_ANDROID" \
            build/symbols/android/
          rm /tmp/sa_key.json

  # ──────────────────────────────────────────────────────────────────────────
  # Build iOS (IPA para App Store Connect)
  # ──────────────────────────────────────────────────────────────────────────
  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: quality_check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Inject firebase_options.dart
        run: |
          if [ -n "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/firebase_options.dart
          else
            echo "Warning: FIREBASE_OPTIONS_BASE64 secret is missing. The build might fail."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Inject GoogleService-Info.plist
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "Warning: GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is missing. iOS build might fail."
          fi

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Crear ficheros temporales
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decodificar los secrets a ficheros
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Crear un keychain temporal y configurarlo
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Importar el certificado al keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Instalar el provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Generate ExportOptions.plist
        run: |
          # Extraer el nombre del perfil de aprovisionamiento instalado
          PP_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n1)
          PROFILE_NAME=$(security cms -D -i "$PP_PATH" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          TEAM_ID="A795NXART6"
          BUNDLE_ID="com.gabriom.playingtrackerapp"
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          echo "ExportOptions.plist generado para perfil: $PROFILE_NAME"

      - name: Build IPA (signed for App Store)
        run: |
          flutter build ipa \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols/ios \
            --build-number="${{ github.run_number }}" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.ref_name }}
          path: build/ios/ipa/*.ipa

      - name: Clean up keychain and provisioning profile
        if: ${{ always() }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain $KEYCHAIN_PATH
          rm ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision


      - name: Upload iOS debug symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-symbols-${{ github.ref_name }}
          path: build/symbols/ios/

      # ── Subida de símbolos dSYM a Firebase Crashlytics ───────────────────
      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload Crashlytics dSYM symbols (iOS)
        if: vars.FIREBASE_APP_ID_IOS != ''
        env:
          FIREBASE_APP_ID_IOS: ${{ vars.FIREBASE_APP_ID_IOS }}
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > /tmp/sa_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa_key.json
          firebase crashlytics:symbols:upload \
            --app="$FIREBASE_APP_ID_IOS" \
            build/symbols/ios/
          rm /tmp/sa_key.json
